<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    
    <h1 style="text-align: center">MY TABLE TEST</h1>
    <h1 style="text-align: center">^_^</h1>
    <div class="padding" style="padding: 30px; text-align: center">
      <table border="1" width="500" height="600" style="margin: 0 auto;">
        <tr>
          <td>a</td>
          <td colspan="2" rowspan="2">b</td>
        <td>c</td>
        <td colspan="2">d</td>
        <td rowspan="5">e</td>
      </tr>

      <tr>
        <td>f</td>
        <td>g</td>
        <td>h</td>
        <td rowspan="3">i</td>
      </tr>

      <tr>
        <td rowspan="3">j</td>
        <td>k</td>
        <td colspan="3" rowspan="2">l</td>
      </tr>

      <tr>
        <td>m</td>
      </tr>

      <tr>
        <td colspan="2">n</td>
        <td rowspan="2">o</td>
        <td>p</td>
        <td>q</td>
      </tr>

      <tr>
        <td>r</td>
        <td>s</td>
        <td>t</td>
        <td colspan="2" rowspan="2">u</td>
        <td>v</td>
      </tr>

      <tr>
        <td colspan="3" rowspan="2">w</td>
        <td>x</td>
        <td rowspan="2">y</td>
      </tr>

      <tr>
        <td>z</td>
        <td>1</td>
        <td>2</td>
      </tr>

    </table>
  </div>
  </body>
</html>
